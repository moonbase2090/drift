[workspace]
resolver = "2"
members = [
    "crates/drift-core",
    "crates/drift-source",
    "crates/drift-apply",
    "crates/drift-tui",
    "crates/drift-cli",
    "crates/drift-fixtures",
    "xtask",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/moonbase2090/drift"
publish = false

[workspace.dependencies]
drift-core = { path = "crates/drift-core" }
drift-source = { path = "crates/drift-source" }
drift-apply = { path = "crates/drift-apply" }
drift-tui = { path = "crates/drift-tui" }
drift-fixtures = { path = "crates/drift-fixtures" }
lunatui = { git = "https://github.com/moonbase2090/lunatui", tag = "v0.1.30", version = "=0.1.30", default-features = false, features = ["app", "keymap"] }
lunatui-core = { git = "https://github.com/moonbase2090/lunatui", tag = "v0.1.30", version = "=0.1.30", features = ["blit"] }
lunatui-runtime = { git = "https://github.com/moonbase2090/lunatui", tag = "v0.1.30", version = "=0.1.30", default-features = false, features = ["app", "keymap"] }
lunatui-term = { git = "https://github.com/moonbase2090/lunatui", tag = "v0.1.30", version = "=0.1.30" }
lunatui-theme = { git = "https://github.com/moonbase2090/lunatui", tag = "v0.1.30", version = "=0.1.30" }
lunatui-widgets = { git = "https://github.com/moonbase2090/lunatui", tag = "v0.1.30", version = "=0.1.30", default-features = false, features = ["code-view", "command-palette", "key-hints", "split-keys", "tree"] }
lunatui-test = { git = "https://github.com/moonbase2090/lunatui", tag = "v0.1.30", version = "=0.1.30" }
terminal_size = "0.4"
inotify = { version = "0.9.6", default-features = false }
libc = "0.2"

[profile.dev.package."*"]
opt-level = 2

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  pacman-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Refuse to publish without the package signing key
        env:
          DRIFT_PACKAGE_KEY: ${{ secrets.DRIFT_PACKAGE_KEY }}
        run: packaging/release-repo.sh check-key

      - name: Build and sign the package repository
        env:
          DRIFT_PACKAGE_KEY: ${{ secrets.DRIFT_PACKAGE_KEY }}
          DRIFT_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          umask 0077
          printf '%s\n' "$DRIFT_PACKAGE_KEY" > "$RUNNER_TEMP/package-key.asc"
          version="${DRIFT_VERSION#v}"
          docker run --rm \
            -v "$PWD:/src" \
            -v "$RUNNER_TEMP/package-key.asc:/run/package-key.asc:ro" \
            -w /src \
            -e DRIFT_KEY_FILE=/run/package-key.asc \
            -e DRIFT_VERSION="$version" \
            archlinux:base-devel \
            bash -lc 'pacman-key --init && pacman-key --populate archlinux && pacman -Syu --noconfirm --needed base-devel git rust sudo patchelf && bash packaging/release-repo.sh stage /src/repo-out'
          rm -f "$RUNNER_TEMP/package-key.asc"

      - name: Replace the pacman-repo release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view pacman-repo >/dev/null 2>&1; then
            gh release create pacman-repo \
              --title "omarchy-drift pacman repository" \
              --notes "Signed omarchy-drift repository. Each version tag replaces these assets."
          fi
          gh release upload pacman-repo --clobber repo-out/*
